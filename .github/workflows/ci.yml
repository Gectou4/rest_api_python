name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Lint with ruff
        run: ruff check src/ tests/
      - name: Format check with ruff
        run: ruff format --check src/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rest_api
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysql -h 127.0.0.1 -u root -proot -e "SELECT 1" rest_api >/dev/null 2>&1 && exit 0
            echo "Waiting for MySQL ($i/30)..."
            sleep 2
          done
          echo "MySQL did not become ready"
          exit 1
      - name: Initialize database
        run: |
          # The health check can pass while MySQL still runs its temporary
          # init server (socket only), so wait until TCP connections work.
          for i in $(seq 1 30); do
            mysql -h 127.0.0.1 -u root -proot -e 'SELECT 1' >/dev/null 2>&1 && break
            sleep 2
          done
          mysql -h 127.0.0.1 -u root -proot rest_api < share/sql/rest_api.sql
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pymysql
      - name: Run tests with pytest
        env:
          DB_USER: root
          DB_PWD: root
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: rest_api
        run: pytest tests/ -v
